<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Blur | AlphOols</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="styles.css?v=1">
<script src="/theme.js"></script>
<link rel="icon" href="/media/profile.jpg">
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="/" aria-label="Kembali ke daftar tools">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="topbar-brand">
    <div class="topbar-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
    </div>
    BLUR
  </div>
</div>

<div class="hint-bar">
  <span class="hint-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
  </span>
  <span>Pilih jenis blur · atur lewat chip dan slider</span>
</div>

<div class="content">

  <div class="dropzone" id="dropzone">
    <div class="dropzone-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
    </div>
    <div class="dropzone-title">Ketuk untuk pilih foto</div>
    <div class="dropzone-sub">atau tarik &amp; lepas di sini</div>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div class="editor" id="editor" hidden>

    <div class="preview-wrap">
      <div class="stage-outer"><div class="canvas-wrap"><canvas id="canvas"></canvas><canvas id="maskView"></canvas></div></div>
    </div>

    <button class="ghost-btn" id="changeBtn">Ganti Foto</button>

    <div class="prop-block">
      <div class="section-label">Jenis Blur</div>
      <div class="section-label-row">Pilih efek yang diinginkan</div>
      <div class="types" id="types"></div>
    </div>

    <div class="prop-block">
      <div class="blk-head">
        <div class="section-label">Pengaturan</div>
        <button type="button" class="link-btn" id="resetAll">Reset semua</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="ctl">
        <button type="button" class="step-btn" id="stepM" aria-label="Kurangi">−</button>
        <input type="range" id="rg" step="1">
        <button type="button" class="step-btn" id="stepP" aria-label="Tambah">+</button>
        <input class="num" type="number" id="nu" step="1" aria-label="Nilai">
        <button type="button" class="reset-btn" id="rs" aria-label="Reset nilai ini" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      </div>
    </div>

    <div class="prop-block">
      <div class="section-label">Area Blur</div>
      <div class="section-label-row">Seluruh foto, atau hanya bagian yang kamu gosok</div>
      <div class="seg" id="areaSeg">
        <button type="button" class="active" data-a="all">Seluruh foto</button>
        <button type="button" data-a="brush">Kuas</button>
      </div>
      <div class="brush-box" id="brushBox" hidden>
        <div class="seg" id="modeSeg">
          <button type="button" class="active" data-m="paint">Gosok</button>
          <button type="button" data-m="erase">Hapus</button>
        </div>
        <div class="btn-row">
          <button type="button" class="ghost-btn" id="undoBtn">Urungkan</button>
          <button type="button" class="ghost-btn" id="clearBtn">Bersihkan</button>
        </div>
        <div class="opt-desc">Gosok di foto untuk memilih bagian yang di-blur. Ukuran kuas diatur di chip "Kuas".</div>
      </div>
    </div>

    <button class="btn-download-main" id="downloadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      Unduh PNG
    </button>
  </div>

</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastMsg">Selesai</span>
</div>

<script src="script.js?v=1"></script>
</body>
</html>
