<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ubin | AlphOols</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="styles.css?v=6">
<script src="/theme.js"></script>
<link rel="icon" href="/media/profile.jpg">
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="/" aria-label="Kembali ke daftar tools">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="topbar-brand">
    <div class="topbar-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
    </div>
    UBIN
  </div>
</div>

<div class="hint-bar">
  <span class="hint-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
  </span>
  <span>Ulangi gambar jadi pola · PNG transparan paling bagus</span>
</div>

<div class="content">

  <div class="dropzone" id="dropzone">
    <div class="dropzone-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
    </div>
    <div class="dropzone-title">Ketuk untuk pilih gambar</div>
    <div class="dropzone-sub">atau tarik &amp; lepas di sini</div>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div class="editor" id="editor" hidden>

    <div class="preview-wrap">
      <div class="stage-outer"><div class="stage-inner" id="stageInner"><canvas id="canvas"></canvas></div></div>
      <div class="preview-meta" id="sizeLabel">1080 × 1080 px</div>
    </div>

    <div class="prop-block">
      <div class="section-label canvas-title">Kanvas</div>
      <button type="button" class="drop-btn size-dd" id="sizeBtn" aria-expanded="false">
        <span class="dd-main"><b id="sizeName">Post 1:1</b><span id="sizeDim">1080 × 1080</span></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="opt-panel" id="sizePanel" hidden>
        <button type="button" class="opt-item active" data-p="post" data-w="1080" data-h="1080"><span>Post <em>1:1</em></span><b class="dim">1080 × 1080</b><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
        <button type="button" class="opt-item" data-p="feed" data-w="1080" data-h="1350"><span>Feed <em>4:5</em></span><b class="dim">1080 × 1350</b><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
        <button type="button" class="opt-item" data-p="story" data-w="1080" data-h="1920"><span>Story <em>9:16</em></span><b class="dim">1080 × 1920</b><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
        <button type="button" class="opt-item" data-p="banner" data-w="1920" data-h="1080"><span>Banner <em>16:9</em></span><b class="dim">1920 × 1080</b><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
        <button type="button" class="opt-item" data-p="custom"><span>Bebas<small>Ketik ukuran sendiri</small></span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
      </div>
      <div class="custom-size" id="customSize" hidden>
        <input class="num" type="number" id="wIn" min="64" max="8192" step="1" value="1080" aria-label="Lebar">
        <span>×</span>
        <input class="num" type="number" id="hIn" min="64" max="8192" step="1" value="1080" aria-label="Tinggi">
        <span>px</span>
      </div>
      <div class="divider"></div>
      <div class="bg-row">
        <span class="bg-lab">Latar</span>
        <div class="swatches" id="bgSwatches">
          <button type="button" class="swatch active" data-type="none" aria-label="Transparan"><span class="checker"></span></button>
          <button type="button" class="swatch" data-type="color" data-color="#FFFFFF" aria-label="Putih" style="background:#FFFFFF"></button>
          <button type="button" class="swatch k" data-type="color" data-color="#111112" aria-label="Hitam" style="background:#111112"></button>
          <label class="swatch custom" id="colorSwatch" aria-label="Warna sendiri"><span class="rainbow" id="colorFill"></span><input type="color" id="customColor" value="#10B981"></label>
          <button type="button" class="swatch imgsw" id="imgSwatch" data-type="image" aria-label="Gambar sendiri"><span class="imgfill" id="imgFill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg></span></button>
        </div>
      </div>
      <input type="file" id="bgImgInput" accept="image/*" hidden>
    </div>


    <div class="prop-block">
      <div class="blk-head">
        <div class="section-label">Pengaturan Pola</div>
        <button type="button" class="link-btn" id="resetAll">Reset semua</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="ctl">
        <button type="button" class="step-btn" id="stepM" aria-label="Kurangi">−</button>
        <input type="range" id="rg" step="1">
        <button type="button" class="step-btn" id="stepP" aria-label="Tambah">+</button>
        <input class="num" type="number" id="nu" step="1" aria-label="Nilai">
        <button type="button" class="reset-btn" id="rs" aria-label="Reset nilai ini" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      </div>
    </div>

    <div class="prop-block">
      <div class="opt">
        <div class="opt-row">
          <div><div class="opt-name">Arah Offset</div><div class="opt-desc">Cara ubin bergeser</div></div>
          <button type="button" class="drop-btn" id="modeBtn" aria-expanded="false"><span id="modeLabel">Baris</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
        <div class="opt-panel" id="modePanel" hidden>
          <button type="button" class="opt-item active" data-v="row"><span>Baris<small>Baris genap geser ke samping</small></span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
          <button type="button" class="opt-item" data-v="col"><span>Kolom<small>Kolom genap geser ke atas/bawah</small></span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
        </div>
      </div>
      <div class="opt">
        <div class="opt-row">
          <div><div class="opt-name">Mirror</div><div class="opt-desc">Balik ubin selang-seling</div></div>
          <button type="button" class="switch" id="mirrorSw" role="switch" aria-checked="false" aria-label="Mirror"></button>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button class="solid-btn" id="changeBtn" type="button">Ganti Gambar</button>
      <button class="btn-download-main" id="downloadBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Unduh PNG
      </button>
    </div>

  </div>

</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastMsg">Selesai</span>
</div>

<script src="script.js?v=6"></script>
</body>
</html>
