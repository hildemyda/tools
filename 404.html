<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman tidak ditemukan | AlphOols</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/media/profile.jpg">

    <script>
        try { (function () { var m = document.cookie.match(/(?:^|;\s*)theme=(light|dark)/); var t = m ? m[1] : localStorage.getItem('theme'); if (t === 'light') document.documentElement.classList.add('light'); })(); } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Halaman ini tampil di alamat apa pun yang tidak ada, jadi semua path memakai garis miring di depan. -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <button class="top-theme theme-float" type="button" data-theme-toggle aria-label="Ganti tema terang atau gelap">
        <i class="sun" data-icon="sun"></i>
        <i class="moon" data-icon="moon"></i>
    </button>

    <main class="nf">
        <p class="nf-code" aria-hidden="true">404</p>
        <h1 class="nf-title">Halaman tidak ditemukan</h1>
        <p class="nf-text">Alamat yang kamu buka tidak ada atau sudah dipindah.</p>
        <div class="nf-actions">
            <a class="btn btn-solid" href="/">Kembali ke daftar tools</a>
        </div>
    </main>

    <script src="/js/site.js"></script>
</body>
</html>
